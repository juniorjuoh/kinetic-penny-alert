name: kinetic-alert

on:
  schedule:
    # ~5.5h jobs chained back to back to cover 04:00-20:00 ET (08:00-00:00 UTC summer, 09:00-01:00 UTC winter).
    # Off-peak minutes (not :00/:30, GitHub delays those a lot) and an early start: the script waits until the
    # pre-market opens (up to 150 min ahead), so a late start of up to ~40 min still catches the open.
    - cron: "17 7 * * 1-5"
    - cron: "47 12 * * 1-5"
    - cron: "47 17 * * 1-5"
    - cron: "17 23 * * 1-5"      # winter-time tail (after-hours until 20:00 EST); exits at once in summer
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Run time in minutes (use 3 for a quick test)"
        default: "330"
      always:
        description: "Run even when the US market is closed (for testing)"
        type: boolean
        default: false

# one job at a time; a later trigger waits for the current one instead of cancelling it
concurrency:
  group: kinetic-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # carry the watchlist / already-sent keys from the previous job so alerts are not repeated
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: kinetic-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kinetic-state-

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_CHANGE_PCT: ${{ vars.MIN_CHANGE_PCT }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          MIN_VOLUME: ${{ vars.MIN_VOLUME }}
          INCLUDE_OTC: ${{ vars.INCLUDE_OTC }}
          USE_FORMING_BAR: ${{ vars.USE_FORMING_BAR }}
          # paused on 2026-11-20: only the previous-day-high alert (PDH_ALERTS) is on. To bring one back, change its "0" to "1".
          PDH_ALERTS: "1"
          MOVER_ALERTS: "0"
          KINETIC_ALERTS: "0"
          R2_ALERTS: "0"
          CUSTOM_ALERTS: "0"
        run: |
          ARGS="--max-minutes ${{ inputs.max_minutes || 330 }} --exit-when-closed"
          if [ "${{ inputs.always }}" = "true" ]; then ARGS="$ARGS --always"; fi
          python kinetic_alert.py $ARGS

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: kinetic-state-${{ github.run_id }}-${{ github.run_attempt }}
